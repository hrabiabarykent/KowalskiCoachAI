services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kowalski-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite:///./users.db
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/users.db:/app/users.db
